name: practical-github-actions

on:
	push: 
		branches: main
		
		
permissions:
  	contents: read
  	pages: write
  	id-token: write
	
jobs:
	deploy:
		runs-on: ubuntu-latest
		
		steps: 
			-name: Checkout Code
			 uses: actions/chekout@v4
			
			-name: Setup Pages
			 uses: actions/configure-pages@5
			
			-name: Upload Website
			 uses: actions/upload-pages-artifact@v3
			 with: 
			 	path: .
			 	
			-name: Deploy to Github Pages 
			 uses: actions/deploy-pages@v4
